<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Baken-KING 認証テスト</title><style>body{font:16px -apple-system,sans-serif;max-width:440px;margin:24px auto;padding:16px;background:#f3f7f5;color:#173733}section{background:#fff;padding:20px;border-radius:16px}input,button{font:inherit;box-sizing:border-box;padding:12px;width:100%;margin:6px 0 12px}input{border:1px solid #b6cec2;border-radius:9px}button{background:#086c54;color:white;border:0;border-radius:9px}p{line-height:1.6}.warning{background:#fff0d7;padding:12px;border-radius:9px}#out{white-space:pre-wrap;overflow-wrap:anywhere}</style><h1>認証方式テスト</h1><p class="warning"><strong>本番ではなく、完全に別のテスト認証環境です。</strong>今までの本アカウント・サブアカウントのパスワードは入力しないでください。馬券や友達の記録にはアクセスしません。</p><section><button id="probe">Cookie接続を診断</button><p id="out" role="status">未確認</p><details><summary>テスト用の新規アカウントで認証を試す</summary><p>この環境専用のメール・パスワードを使います。</p><label>メール<input id="email" type="email" autocomplete="off"></label><label>パスワード<input id="password" type="password" minlength="8" autocomplete="new-password"></label><button id="signup">テスト登録</button><button id="login">テストログイン</button><button id="session">セッション確認</button><button id="logout">ログアウト</button></details></section><script>
const $=id=>document.getElementById(id);
async function api(name,body){const opts={credentials:'same-origin',cache:'no-store',headers:{Accept:'application/json'}};if(body){opts.method='POST';opts.headers['Content-Type']='application/json';opts.body=JSON.stringify(body)}const r=await fetch('/api/auth/'+name,opts);if(!r.ok)throw Error('HTTP '+r.status);return r.json()}
async function run(fn){try{$('out').textContent=await fn()}catch(e){$('out').textContent='エラー: '+e.message}}
async function login(path){const email=$('email').value.trim(),password=$('password').value;if(!email||password.length<8)throw Error('テスト用メールとパスワードを入力してください');await api(path,{email,password,...(path==='sign-up/email'?{name:'test-user'}:{})});$('password').value='';const s=await api('get-session');return s.user||s.data?.user?'ログイン維持: 成功':'認証後のセッション: 取得できず'}
$('probe').onclick=()=>run(async()=>{const x=await api('probe');return '認証プロキシ稼働中。Cookie送信: '+(x.hasCookie?'あり':'なし')});
$('signup').onclick=()=>run(()=>login('sign-up/email'));
$('login').onclick=()=>run(()=>login('sign-in/email'));
$('session').onclick=()=>run(async()=>{const x=await api('get-session');return x.user||x.data?.user?'セッション確認: 成功':'セッションなし'});
$('logout').onclick=()=>run(async()=>{await api('sign-out',{});return 'ログアウト済み'});
</script></html>
