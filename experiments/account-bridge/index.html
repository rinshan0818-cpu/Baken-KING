<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Baken-KING｜本番ログイン検証</title><style>body{font:16px -apple-system,BlinkMacSystemFont,sans-serif;max-width:440px;margin:24px auto;padding:16px;background:#f4f7f6;color:#173733}h1{font-size:25px}section{background:white;padding:20px;border-radius:16px;border:1px solid #dce7e2}label{display:block;margin:16px 0 5px}input,button{font:inherit;box-sizing:border-box;padding:12px;width:100%;border-radius:10px}input{border:1px solid #abc6bd}button{margin-top:12px;background:#086c54;color:white;border:0;font-weight:700}button.secondary{background:#e8f1ed;color:#185945}.note{font-size:14px;line-height:1.7;background:#e9f2ee;padding:12px;border-radius:10px}#out{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;line-height:1.6}a{color:#086c54}</style></head><body><h1>Baken-KING｜ログイン接続確認</h1><p class="note">既存の本アカウント・サブアカウントを対象とする認証の検証ページです。<strong>新規登録はしません。</strong>馬券・残高・精算履歴にはアクセスせず、既存アプリの保存データも変更しません。</p><section><div id="form"><label for="email">メールアドレス</label><input id="email" type="email" autocomplete="email"><label for="password">パスワード</label><input id="password" type="password" autocomplete="current-password"><button id="login">ログイン</button></div><div id="logged" hidden><strong>ログイン確認済み</strong><p id="account"></p><button id="logout" class="secondary">ログアウト</button></div><button id="session" class="secondary">ログイン状態を再確認</button><p id="out" role="status" aria-live="polite">確認前</p></section><p><a href="https://rinshan0818-cpu.github.io/Baken-KING/">これまでのBaken-KINGを開く</a></p><script>
const $=id=>document.getElementById(id);let busy=false;
async function call(path,body){const opts={credentials:'same-origin',cache:'no-store',headers:{Accept:'application/json'}};if(body){opts.method='POST';opts.headers['Content-Type']='application/json';opts.body=JSON.stringify(body)}const r=await fetch('/api/auth/'+path,opts);const result=await r.json().catch(()=>({}));if(!r.ok||result.error)throw Error('認証に失敗しました（HTTP '+r.status+'）');return result}
function show(user){$('form').hidden=!!user;$('logged').hidden=!user;$('account').textContent=user?'メールアドレス：'+(user.email||'確認済み')+'\nメール認証：'+(user.emailVerified===true?'確認済み':'未確認'):''}
async function refresh(){const r=await call('get-session');const user=r?.user||r?.data?.user||null;show(user);return user}
async function run(fn){if(busy)return;busy=true;for(const b of document.querySelectorAll('button'))b.disabled=true;try{$('out').textContent=await fn()}catch(e){$('out').textContent=e.message}finally{busy=false;for(const b of document.querySelectorAll('button'))b.disabled=false}}
$('login').onclick=()=>run(async()=>{const email=$('email').value.trim(),password=$('password').value;if(!email||!password)throw Error('メールとパスワードを入力してください');await call('sign-in/email',{email,password});$('password').value='';const user=await refresh();return user?'ログイン維持に成功しました。再読み込み後にも確認してください。':'ログイン応答はありましたが、セッションを維持できません'});
$('session').onclick=()=>run(async()=>await refresh()?'ログイン状態を確認しました。':'未ログインです。');
$('logout').onclick=()=>run(async()=>{await call('sign-out',{});show(null);return 'ログアウトしました。'});
run(async()=>await refresh()?'ログイン状態を確認しました。':'未ログインです。');
</script></body></html>
