name: Validate race data (offline)
on:
  workflow_dispatch:
  push:
    paths:
      - 'race-data.js'
      - 'data/historical-fixture.json'
      - 'tests/race-data.test.cjs'
      - 'jra-adapter.js'
      - 'race-bundle.js'
      - 'tests/race-bundle.test.cjs'
      - 'scripts/inspect-private-race.cjs'
      - 'tests/private-race-cli.test.cjs'
      - 'tests/jra-adapter.test.cjs'
      - '.github/workflows/validate-race-data.yml'
jobs:
  fixture-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test fictional historical data and safe purchase rules
        run: |
          node tests/race-data.test.cjs
          node tests/jra-adapter.test.cjs
          node tests/race-bundle.test.cjs
          node tests/private-race-cli.test.cjs
