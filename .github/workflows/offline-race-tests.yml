name: Offline race data checks
on:
  push:
    paths:
      - 'scripts/normalize_private_race.py'
      - 'scripts/import_private_race.py'
      - 'tests/test_private_race_refunds.py'
      - 'tests/test_normalize_private_race.py'
      - 'tests/test_import_private_race.py'
      - 'scripts/audit_race_import.py'
      - 'scripts/jra_card_parser.py'
      - 'tests/test_jra_header_conditions.py'
      - 'tests/test_jra_card_pipeline.py'
      - 'scripts/jra_card_normalizer.py'
      - 'scripts/fetch_jra_cards.py'
      - 'tests/test_jra_charset.py'
      - 'tests/test_race_conditions_import.py'
      - 'tests/test_audit_race_import.py'
      - '.github/workflows/offline-race-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install beautifulsoup4
      - name: Run offline normalization and settlement tests
        run: |
          python -m unittest discover -s tests -p 'test_*private_race*.py' -v
          python -m unittest discover -s tests -p 'test_import_private_race.py' -v
          python -m unittest discover -s tests -p 'test_audit_race_import.py' -v
          python -m unittest discover -s tests -p 'test_jra_header_conditions.py' -v
          python -m unittest discover -s tests -p 'test_jra_card_pipeline.py' -v
          python -m unittest discover -s tests -p 'test_jra_charset.py' -v
          python -m unittest discover -s tests -p 'test_race_conditions_import.py' -v
