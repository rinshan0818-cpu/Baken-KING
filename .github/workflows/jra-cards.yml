name: JRA card importer validation
on:
  push:
    paths:
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/jra-cards.yml'
  workflow_dispatch:
    inputs:
      official_index_url:
        description: 'Official JRA page containing race links (optional)'
        required: false
        type: string
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install beautifulsoup4
      - name: Test parsers and import pipeline
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Discover and fetch official cards (manual only)
        if: github.event_name == 'workflow_dispatch'
        env:
          JRA_INDEX_URL: ${{ inputs.official_index_url }}
        run: |
          mkdir -p artifacts
          python scripts/crawl_jra_cards.py artifacts/manifest.json "https://sp.jra.jp/JRADB/accessD.html?CNAME=sw01dde0105202604100120261031%2F3B" "https://sp.jra.jp/JRADB/accessD.html?CNAME=sw01dde0108202604100120261031%2FDF" \
            ${JRA_INDEX_URL:+"$JRA_INDEX_URL"} || true
          if [ -s artifacts/manifest.json ]; then
            python scripts/fetch_jra_cards.py artifacts/manifest.json artifacts/parsed.json || true
          fi
          if [ -s artifacts/parsed.json ]; then
            python scripts/merge_verified_cards.py data/race-catalog-2026-10-31.json artifacts/parsed.json artifacts/merged-catalog.json || true
          fi
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: jra-cards-validation
          path: artifacts/
          if-no-files-found: warn
          retention-days: 3
