name: JRA card importer validation
on:
  push:
    paths:
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/jra-cards.yml'
  workflow_dispatch:
    inputs:
      official_index_url:
        description: 'Official JRA page containing race links (optional)'
        required: false
        type: string
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install beautifulsoup4
      - name: Test parsers and import pipeline
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Discover and fetch official cards (manual only)
        env:
          JRA_INDEX_URL: ${{ inputs.official_index_url }}
        run: |
          mkdir -p artifacts
          python scripts/crawl_jra_cards.py artifacts/manifest.json "https://sp.jra.jp/JRADB/accessD.html?CNAME=sw01ddd0105202604100120261031%2F3B" "https://sp.jra.jp/JRADB/accessD.html?CNAME=sw01ddd0108202604101220261031%2F20" \
            ${JRA_INDEX_URL:+"$JRA_INDEX_URL"} || true
          if [ -s artifacts/manifest.json ]; then
            python scripts/fetch_jra_cards.py artifacts/manifest.json artifacts/parsed.json --errors-output artifacts/fetch-errors.json || true
          fi
          if [ -s artifacts/parsed.json ]; then
            python scripts/merge_verified_cards.py data/race-catalog-2026-10-31.json artifacts/parsed.json artifacts/merged-catalog.json || true
          fi
      - name: Publish validated race cards to app catalog
        if: github.event_name == 'workflow_dispatch'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          parsed = Path("artifacts/parsed.json")
          merged = Path("artifacts/merged-catalog.json")
          if not parsed.exists() or not merged.exists():
              raise SystemExit("No parsed/merged catalog; refusing to publish")
          count = json.loads(parsed.read_text(encoding="utf-8")).get("raceCount", 0)
          if count < 23:
              raise SystemExit(f"Only {count} races validated; refusing to publish")
          catalog = json.loads(merged.read_text(encoding="utf-8"))
          expected = {(venue, race) for venue in ("東京", "京都") for race in range(1, 13)}
          confirmed = {(r["venue"], r["raceNumber"]) for r in catalog["races"]
                       if r["date"] == "2026-10-31" and r.get("numbersConfirmed")
                       and r.get("horses")}
          if len(confirmed & expected) < 23:
              raise SystemExit("Catalog confirmation count does not match; refusing to publish")
          Path("data/race-catalog-2026-10-31.json").write_text(
              json.dumps(catalog, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(f"Publishing {len(confirmed & expected)} confirmed race cards")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/race-catalog-2026-10-31.json
          if ! git diff --cached --quiet; then
            git commit -m "Import validated JRA race cards for 2026-10-31"
            git push
          fi
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'workflow_dispatch'
        with:
          name: jra-cards-validation
          path: artifacts/
          if-no-files-found: warn
          retention-days: 3
