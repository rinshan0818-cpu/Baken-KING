name: PWA monitoring and verified-result regression
on:
  push:
    paths:
      - 'app-next-monitor.js'
      - 'admin-panel.js'
      - 'admin-panel.css'
      - 'api/auth/**'
      - 'settings-surface.js'
      - 'tests/test-admin-release-isolation.cjs'
      - 'app-next-cards.js'
      - 'api/auth/index.js'
      - 'race-card-auto-sync.js'
      - 'tests/test-account-race-cards-proxy.cjs'
      - 'app-next-results.js'
      - 'monitor-target-export.js'
      - 'sharing-server/scheduler-union-http.cjs'
      - 'sharing-server/vercel-entry.cjs'
      - 'api/index.js'
      - 'tests/test-scheduler-union-http.cjs'
      - 'tests/test-scheduler-routing-fail-closed.cjs'
      - 'tests/test-monitor-account-isolation.cjs'
      - 'sharing-server/monitor-store.cjs'
      - 'sharing-server/**'
      - 'scripts/check-sharing-release.cjs'
      - 'tests/test-sharing-release-guard.cjs'
      - 'vercel.json'
      - 'tests/test-monitor-target-retirement.cjs'
      - 'tests/test-verified-results-fast-poll.cjs'
      - 'tests/test-account-monitor-heartbeat.cjs'
      - '.github/workflows/pwa-monitor-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  monitoring-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify pending-only polling, subscription updates and target retirement
        run: |
          node --test tests/test-verified-results-fast-poll.cjs
          node --test tests/test-account-monitor-heartbeat.cjs
          node --test tests/test-account-race-cards-proxy.cjs
          node --test tests/test-admin-release-isolation.cjs
          node --test tests/test-monitor-target-retirement.cjs
          node --test tests/test-scheduler-union-http.cjs
          node --test tests/test-scheduler-routing-fail-closed.cjs
          node --test tests/test-monitor-account-isolation.cjs
          node --test tests/test-sharing-release-guard.cjs
          node scripts/check-sharing-release.cjs
