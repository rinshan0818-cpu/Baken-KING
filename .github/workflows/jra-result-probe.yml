name: JRA historic payout parse diagnostics (metadata only)

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/jra-result-probe.yml'

permissions:
  contents: write

jobs:
  results-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install HTML parser
        run: python -m pip install 'beautifulsoup4>=4.12,<5'
      - name: Test fictional results before network probe
        run: python -m unittest discover -s tests -p 'test_jra_result_probe.py' -v
      - name: Probe one historical official result and seven payout labels
        env:
          BAKEN_ALLOW_JRA_TEST: 'yes'
        shell: bash
        run: |
          set +e
          python scripts/jra_result_probe.py \
            --live-once \
            --status-file docs/jra-result-probe-status.json
          code=$?
          echo "RESULT_EXIT_CODE=$code" >> "$GITHUB_ENV"
          exit 0
      - name: Commit anonymous diagnostic counts only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/jra-result-probe-status.json
          if ! git diff --staged --quiet; then
            git commit -m "JRA historical result category availability status [skip ci]"
            git push origin HEAD:main
          fi
      - name: Fail if page availability was not verified
        if: env.RESULT_EXIT_CODE != '0'
        run: exit 1
