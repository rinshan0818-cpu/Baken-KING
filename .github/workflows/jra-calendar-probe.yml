name: One-time official JRA program schedule probe

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  one-calendar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install minimal offline parser dependency
        run: python -m pip install 'beautifulsoup4>=4.12,<5'
      - name: Verify parser with fictional HTML, no external horse-racing requests
        run: python -m unittest discover -s tests -p test_jra_calendar_probe.py -v
      - name: Probe one JRA official public racing program only
        env:
          BAKEN_ALLOW_JRA_TEST: 'yes'
        shell: bash
        run: |
          set +e
          python scripts/jra_calendar_probe.py \
            --date 2026-10-31 \
            --live-once \
            --min-races 24 \
            --status-file docs/jra-calendar-probe-status.json
          saturday_exit=$?
          # At most one additional page; no parallel requests.
          sleep 2
          python scripts/jra_calendar_probe.py \
            --date 2026-11-01 \
            --live-once \
            --min-races 24 \
            --status-file docs/jra-calendar-probe-status-sunday.json
          sunday_exit=$?
          if [ "$saturday_exit" -eq 0 ] && [ "$sunday_exit" -eq 0 ]; then
            echo "PROBE_EXIT_CODE=0" >> "$GITHUB_ENV"
          else
            echo "PROBE_EXIT_CODE=1" >> "$GITHUB_ENV"
          fi
          echo "Public reports contain only source, UTC time and race counts. NO raw race data."
          exit 0
      - name: Commit only aggregate probe status for remote inspection
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/jra-calendar-probe-status.json docs/jra-calendar-probe-status-sunday.json
          if ! git diff --staged --quiet; then
            git commit -m "Update official program probe status (counts only) [skip ci]"
            git push origin HEAD:main
          fi
      - name: Fail if the actual one-shot read did not validate
        if: env.PROBE_EXIT_CODE != '0'
        run: |
          echo "JRA calendar check unsuccessful; inspect docs/jra-calendar-probe-status.json."
          exit 1
