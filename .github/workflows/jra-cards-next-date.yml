name: JRA next-date card verification
on:
  schedule:
    # Thursday/Friday JST: prepare the coming weekend candidate dates.
    - cron: '15 21 * * 3,4'
  workflow_dispatch:
    inputs:
      race_date:
        description: 'Target race date (YYYY-MM-DD)'
        required: false
        type: string
      official_seed_url:
        description: 'Official JRA card or index URL for that date'
        required: true
        type: string
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install beautifulsoup4
      - name: Identify upcoming weekend dates in JST
        run: |
          mkdir -p artifacts
          python scripts/jra_candidate_dates.py --output artifacts/candidate-dates.json
      - name: Validate date and official source
        if: github.event_name == 'workflow_dispatch'
        env:
          RACE_DATE: ${{ inputs.race_date }}
          SEED_URL: ${{ inputs.official_seed_url }}
        run: |
          python - <<'PY'
          import os
          from datetime import date
          from urllib.parse import urlparse
          d = date.fromisoformat(os.environ['RACE_DATE'])
          assert d.isoformat() == os.environ['RACE_DATE']
          p = urlparse(os.environ['SEED_URL'])
          assert p.scheme == 'https' and p.hostname in {'jra.jp','sp.jra.jp','app.jra.jp'}
          assert p.path == '/JRADB/accessD.html'
          PY
      - name: Run parser tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Crawl and validate requested date (read only)
        if: github.event_name == 'workflow_dispatch'
        env:
          RACE_DATE: ${{ inputs.race_date }}
          SEED_URL: ${{ inputs.official_seed_url }}
        run: |
          mkdir -p artifacts
          python scripts/crawl_jra_cards.py artifacts/manifest.json "$SEED_URL" --date "$RACE_DATE"
          python scripts/fetch_jra_cards.py artifacts/manifest.json artifacts/parsed.json --errors-output artifacts/fetch-errors.json --require-complete
          python - <<'PY'
          import json
          data=json.load(open('artifacts/parsed.json'))
          count=data['raceCount']
          if count < 12 or count > 36 or count % 12:
              raise SystemExit(f'Unexpected race count: {count}; expected 12/24/36')
          print(f'Validated {count} race cards for the requested date')
          PY
      - name: Discover scheduled venues from official JRA program pages
        if: github.event_name == 'schedule'
        run: |
          python - <<'PY'
          import json
          import subprocess
          dates=json.load(open('artifacts/candidate-dates.json'))['candidateDates']
          subprocess.run(['python','scripts/jra_program_schedule.py',*dates,
                          '--output','artifacts/provisional-schedule.json'],check=True)
          result=json.load(open('artifacts/provisional-schedule.json'))
          for day in result['days']:
              print(day['date'], day['status'], ','.join(day['venues']))
          PY
      - name: Discover explicitly linked official card seeds (no publication)
        if: github.event_name == 'schedule'
        run: |
          python scripts/discover_jra_card_seeds.py --schedule artifacts/provisional-schedule.json --output artifacts/card-seed-candidates.json
      - name: Scheduled run status
        if: github.event_name == 'schedule'
        run: echo 'Official provisional venues discovered. Confirmed cards and publication are NOT enabled yet.'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: next-date-cards
          path: artifacts/
          if-no-files-found: warn
          retention-days: 3
