name: Race card parser validation
on:
  push:
    paths:
      - "scripts/jra_card_*.py"
      - "scripts/netkeiba_card_parser.py"
      - "scripts/race_card_adapter.py"
      - "tests/test_jra_card_*.py"
      - "tests/test_netkeiba_card_parser.py"
      - "tests/test_race_card_adapter.py"
      - ".github/workflows/jra-card-tests.yml"
  workflow_dispatch:
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install parser dependency
        run: python -m pip install beautifulsoup4
      - name: Run offline tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
