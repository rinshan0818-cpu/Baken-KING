name: Build real-photo horse card preview
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/build-real-card-preview.py'
      - 'scripts/render-real-card-preview.py'
      - '.github/workflows/build-real-card-preview.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install pillow
      - name: Download and resize Wikimedia Commons photos
        run: python scripts/build-real-card-preview.py
      - name: Install Japanese font
        run: sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
      - name: Render face-focused portrait cards
        run: python scripts/render-real-card-preview.py
      - name: Commit locally stored preview photos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cards-real/assets cards-real/rendered
          if ! git diff --cached --quiet; then
            git commit -m "Store CC-licensed real horse photos for preview"
            git push
          fi
