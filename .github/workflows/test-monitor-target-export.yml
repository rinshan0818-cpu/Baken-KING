name: Monitor target selector tests
on:
  push:
    branches: [main]
    paths:
      - 'monitor-target-export.js'
      - 'monitor-target-export.test.cjs'
      - 'monitor-lifecycle.js'
      - 'monitor-lifecycle.test.cjs'
      - '.github/workflows/test-monitor-target-export.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-selector:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check monitor-target-export.js
          node --check monitor-lifecycle.js
      - name: Run selector tests
        run: |
          node --test monitor-target-export.test.cjs
          node --test monitor-lifecycle.test.cjs
