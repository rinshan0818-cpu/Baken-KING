name: UI smoke
on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'tests/browser_smoke.cjs'
      - '.github/workflows/ui-smoke.yml'
permissions:
  contents: read
jobs:
  syntax:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check inline scripts
        run: python3 scripts/check_inline_scripts.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependency
        run: |
          npm install --no-save playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Start local app server
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/baken-server.log 2>&1 &
          sleep 2
      - name: Test race selection in Chromium
        run: node tests/browser_smoke.cjs
      - name: Upload browser test diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke-diagnostics
          path: |
            /tmp/baken-server.log
            test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Run Python regression tests
        run: |
          python3 -m pip install beautifulsoup4
          python3 -m unittest discover -s tests -p 'test_*.py'
