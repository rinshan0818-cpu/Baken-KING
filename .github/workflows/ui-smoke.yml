name: UI smoke
on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'tests/browser_smoke.cjs'
      - 'tests/ui_regression.cjs'
      - 'tests/storage_regression.cjs'
      - 'tests/settlement_backup_regression.cjs'
      - 'tests/race-settlement.test.cjs'
      - 'race-settlement.js'
      - 'friends-share.js'
      - 'share.html'
      - 'tests/share-page.test.cjs'
      - 'tests/friends-comparison-ui.test.cjs'
      - 'tests/friends-comparison-heatmap.test.cjs'
      - 'tests/friend-score-exchange.test.cjs'
      - 'friends-policy.js'
      - 'tests/friends-policy.test.cjs'
      - 'tests/sharing-schema.test.cjs'
      - 'docs/sharing-schema-p1.sql'
      - 'sharing-server/**'
      - 'tests/sharing-server.test.cjs'
      - 'tests/sharing-jwt-auth.test.cjs'
      - 'tests/friends-share.test.cjs'
      - '.github/workflows/ui-smoke.yml'
  pull_request:
permissions:
  contents: read
jobs:
  syntax:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check inline scripts
        run: python3 scripts/check_inline_scripts.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate all browser regression test scripts
        run: |
          find tests -maxdepth 1 -name '*.cjs' -print0 | xargs -0 -r -n 1 node --check
      - name: Install browser test dependency
        run: |
          npm install --no-save playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Start local app server
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/baken-server.log 2>&1 &
          sleep 2
      - name: Test race selection in Chromium
        run: node tests/browser_smoke.cjs
      - name: Test approved tab UI and state isolation
        run: node tests/ui_regression.cjs
      - name: Test purchase storage, reload and test-mode isolation
        run: node tests/storage_regression.cjs
      - name: Test official settlement math, refunds and pending outcomes
        run: node tests/race-settlement.test.cjs
      - name: Test signed login token verification
        run: node tests/sharing-jwt-auth.test.cjs
      - name: Test server sharing access guard
        run: node tests/sharing-server.test.cjs
      - name: Test sharing schema security defaults
        run: node tests/sharing-schema.test.cjs
      - name: Test friend approval and revocation policy
        run: node tests/friends-policy.test.cjs
      - name: Test manual friend score exchange
        run: node tests/friend-score-exchange.test.cjs
      - name: Test two-person heatmap comparison display
        run: node tests/friends-comparison-heatmap.test.cjs
      - name: Test friend comparison data panel structure
        run: node tests/friends-comparison-ui.test.cjs
      - name: Test simple share screen remains local-only
        run: node tests/share-page.test.cjs
      - name: Test consent-gated friend summary projection
        run: node tests/friends-share.test.cjs
      - name: Test one-time settlement and backup restore
        run: node tests/settlement_backup_regression.cjs
      - name: Upload browser test diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke-diagnostics
          path: |
            /tmp/baken-server.log
            test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Run Python regression tests
        if: always()
        run: |
          python3 -m pip install beautifulsoup4
          python3 -m unittest discover -s tests -p 'test_*.py'
