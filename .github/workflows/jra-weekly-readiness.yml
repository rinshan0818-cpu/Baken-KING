name: Weekly JRA card readiness (private)
on:
  schedule:
    - cron: '0 23 * * 4'
    - cron: '0 23 * * 5'
    - cron: '0 23 * * 6'
    - cron: '0 23 * * 0'
  workflow_dispatch:
    inputs:
      start_date:
        description: "Optional start date YYYY-MM-DD (blank = today JST)"
        required: false
        type: string
permissions:
  contents: read
jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify offline parser and normalization tests
        run: |
          python -m pip install beautifulsoup4
          python -m unittest discover -s tests -p 'test_*.py'
      - name: Discover upcoming dated JRA links (read-only, no publishing)
        env:
          USER_START_DATE: ${{ inputs.start_date }}
        run: |
          START_DATE="$(TZ=Asia/Tokyo date +%F)"
          if [ -n "$USER_START_DATE" ]; then START_DATE="$USER_START_DATE"; fi
          DAYS_AHEAD=0
          # Friday: scan through Monday; Saturday: through Monday; Sunday: through Monday.
          WEEKDAY="$(TZ=Asia/Tokyo date +%u)"
          if [ -n "$USER_START_DATE" ]; then WEEKDAY="$(date -u -d "$START_DATE" +%u)"; fi
          case "$WEEKDAY" in 5) DAYS_AHEAD=3;; 6) DAYS_AHEAD=2;; 7) DAYS_AHEAD=1;; esac
          python scripts/discover_upcoming_jra.py upcoming-discovery.json --date "$START_DATE" --days-ahead "$DAYS_AHEAD"
      - name: Validate discovered race cards privately
        run: python scripts/validate_upcoming_cards.py upcoming-discovery.json
      - name: Check private Saturday card completeness
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          cards=json.load(open("private-cards.json",encoding="utf-8"))["races"]
          for day in sorted({c["date"] for c in cards}):
              subset=[c for c in cards if c["date"]==day]
              counts=Counter(c["venue"] for c in subset)
              print("Private fixture",day,"races",len(subset),"venues",dict(counts))
              missing_times=[(c["venue"],c["raceNumber"]) for c in subset if not c.get("scheduledStartAt")]
              print("Missing scheduled start times:",len(missing_times))
              if len(subset)==24 and sorted(counts.values())==[12,12] and not missing_times:
                  with open("private-saturday-cards.json","w",encoding="utf-8") as out:
                      json.dump({"races":subset},out,ensure_ascii=False)
                  print("COMPLETE PRIVATE SATURDAY FIXTURE")
          PY
      - name: Browser-check complete private Saturday fixture
        run: |
          if [ ! -f private-saturday-cards.json ]; then
            echo "No complete 24-race fixture; skipping browser purchase test."
            exit 0
          fi
          npm install --no-save playwright@1.58.2
          npx playwright install --with-deps chromium
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/baken-private-server.log 2>&1 &
          sleep 2
          BAKEN_PRIVATE_CARDS_PATH=private-saturday-cards.json node tests/browser_smoke.cjs
      - name: Upload private browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: private-browser-diagnostics
          path: |
            /tmp/baken-private-server.log
            test-results/
          if-no-files-found: ignore
          retention-days: 1
      - name: Record weekly ingestion status
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path
          import json
          now=datetime.now(timezone.utc)
          validation=json.loads(Path("upcoming-card-validation.json").read_text(encoding="utf-8"))
          result={
              "checkedAtUtc":now.isoformat(),
              "offlineTests":"passed",
              "liveJraCards":"validated_private" if validation["parsed"] else "not_available",
              "discovered":validation["discovered"],
              "parsed":validation["parsed"],
              "venues":validation.get("venues", []),
              "publication":"disabled",
              "nextStep":"Verify all scheduled venues and authorized publication before enabling app import."
          }
          Path("readiness.json").write_text(json.dumps(result,indent=2)+"\n")
          print(json.dumps(result))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: weekly-jra-readiness
          path: |
            readiness.json
            upcoming-discovery.json
            upcoming-card-validation.json
          retention-days: 7
