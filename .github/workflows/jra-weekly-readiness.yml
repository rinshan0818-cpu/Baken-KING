name: Weekly JRA card readiness (private)
on:
  schedule:
    - cron: '0 23 * * 4'
    - cron: '0 23 * * 5'
    - cron: '0 23 * * 6'
    - cron: '0 23 * * 0'
  workflow_dispatch:
    inputs:
      start_date:
        description: "Optional start date YYYY-MM-DD (blank = today JST)"
        required: false
        type: string
permissions:
  contents: read
jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify offline parser and normalization tests
        run: |
          python -m pip install beautifulsoup4
          python -m unittest discover -s tests -p 'test_*.py'
      - name: Discover upcoming dated JRA links (read-only, no publishing)
        env:
          USER_START_DATE: ${{ inputs.start_date }}
        run: |
          START_DATE="$(TZ=Asia/Tokyo date +%F)"
          if [ -n "$USER_START_DATE" ]; then START_DATE="$USER_START_DATE"; fi
          DAYS_AHEAD=0
          # Friday: scan through Monday; Saturday: through Monday; Sunday: through Monday.
          WEEKDAY="$(TZ=Asia/Tokyo date +%u)"
          if [ -n "$USER_START_DATE" ]; then WEEKDAY="$(date -u -d "$START_DATE" +%u)"; fi
          case "$WEEKDAY" in 5) DAYS_AHEAD=3;; 6) DAYS_AHEAD=2;; 7) DAYS_AHEAD=1;; esac
          python scripts/discover_upcoming_jra.py upcoming-discovery.json --date "$START_DATE" --days-ahead "$DAYS_AHEAD"
      - name: Validate discovered race cards privately
        run: python scripts/validate_upcoming_cards.py upcoming-discovery.json
      - name: Run isolated browser check with private cards
        if: ${{ always() }}
        run: |
          echo "Private card integration is opt-in; never publish JRA card data."
          test -f upcoming-card-validation.json
      - name: Record weekly ingestion status
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path
          import json
          now=datetime.now(timezone.utc)
          validation=json.loads(Path("upcoming-card-validation.json").read_text(encoding="utf-8"))
          result={
              "checkedAtUtc":now.isoformat(),
              "offlineTests":"passed",
              "liveJraCards":"validated_private" if validation["parsed"] else "not_available",
              "discovered":validation["discovered"],
              "parsed":validation["parsed"],
              "venues":validation.get("venues", []),
              "publication":"disabled",
              "nextStep":"Verify all scheduled venues and authorized publication before enabling app import."
          }
          Path("readiness.json").write_text(json.dumps(result,indent=2)+"\n")
          print(json.dumps(result))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: weekly-jra-readiness
          path: |
            readiness.json
            upcoming-discovery.json
            upcoming-card-validation.json
          retention-days: 7
