name: Weekly JRA card readiness (private)
on:
  schedule:
    - cron: '0 23 * * 4'
    - cron: '0 23 * * 5'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify offline parser and normalization tests
        run: |
          python -m pip install beautifulsoup4
          python -m unittest discover -s tests -p 'test_*.py'
      - name: Record weekly ingestion status
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path
          import json
          now=datetime.now(timezone.utc)
          result={
              "checkedAtUtc":now.isoformat(),
              "offlineTests":"passed",
              "liveJraCards":"not_attempted",
              "reason":"Future-date official seed URL discovery not yet verified; do not reuse a historical CNAME or invent one.",
              "nextStep":"Implement and validate future-date official race-card discovery before enabling scheduled ingestion."
          }
          Path("readiness.json").write_text(json.dumps(result,indent=2)+"\n")
          print(json.dumps(result))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: weekly-jra-readiness
          path: readiness.json
          retention-days: 7
